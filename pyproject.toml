[project]
name = "claude-chronicle"
version = "1.0.0"
description = "Видит все сессии Claude Code на машине и собирает отчёт о проделанной работе (OKR)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["claude-code", "claude", "ai-agents", "okr", "reports"]

[project.scripts]
chronicle = "chronicle.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chronicle"]
